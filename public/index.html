<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tra cứu giá trị sử dụng thẻ BHYT</title>
  <link rel="icon" href="data:," />
  <style>
    :root {
      --blue:#00aeef;
      --blue-dark:#078bc0;
      --red:#d50909;
      --cyan:#12b7df;
      --border:#cfd8dc;
      --soft:#eef8fc;
      --text:#4a4a4a;
      --muted:#777;
      --green:#0a8f42;
    }
    * { box-sizing:border-box; }
    body {
      margin:0;
      min-height:100vh;
      font-family:Arial,Helvetica,sans-serif;
      background:#fff;
      color:var(--text);
      font-size:12px;
    }
    .page {
      width:860px;
      max-width:calc(100vw - 20px);
      margin:12px auto;
    }
    .lookup {
      border-top:2px solid var(--blue);
      background:#fff;
    }
    .lookup-title {
      display:inline-block;
      min-width:285px;
      height:30px;
      margin-top:-2px;
      padding:7px 18px 0 14px;
      color:#fff;
      font-size:13px;
      font-weight:700;
      line-height:1;
      background:linear-gradient(180deg,#08b9f1 0%,#039fd8 100%);
      border-top-left-radius:2px;
      position:relative;
    }
    .lookup-title::after {
      content:"";
      position:absolute;
      right:-18px;
      top:0;
      width:0;
      height:0;
      border-top:30px solid #039fd8;
      border-right:18px solid transparent;
    }
    .lookup-body {
      position:relative;
      padding:24px 16px 14px;
      border-left:1px solid #e5eef2;
      border-right:1px solid #e5eef2;
      border-bottom:1px solid #e5eef2;
      background:#fff;
    }
    .form-grid {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:18px 44px;
      align-items:center;
    }
    .field {
      display:grid;
      grid-template-columns:126px minmax(160px,1fr);
      align-items:center;
      gap:8px;
    }
    label {
      margin:0;
      color:#696969;
      font-size:12px;
      line-height:1.2;
      text-align:right;
      white-space:normal;
    }
    .req { color:#d00000; font-weight:700; }
    input {
      width:100%;
      height:24px;
      padding:3px 7px;
      border:1px solid #bfc8cc;
      border-radius:0;
      background:#fff;
      color:#333;
      font-size:12px;
      outline:none;
    }
    input:focus {
      border-color:#7cb8d3;
      box-shadow:0 0 0 2px rgba(0,174,239,.12);
    }
    .captcha-row {
      display:block;
      position:relative;
      min-height:86px;
      overflow:visible;
      z-index:10;
    }
    .captcha-label {
      display:none;
    }
    .captcha-box {
      width:100%;
      min-width:260px;
      max-width:350px;
      height:86px;
      border:1px solid #d3d3d3;
      background:#fafafa;
      display:block;
      overflow:hidden;
    }
    .live-slot {
      position:relative;
      display:block;
      height:100%;
    }
    .captcha-box.has-frame {
      position:absolute;
      top:0;
      right:0;
      z-index:30;
      display:block;
      padding:0;
      max-width:none;
      min-width:0;
    }
    .live .bar { display:none; }
    .live .bar span { display:none; }
    button.mini {
      width:auto;
      height:16px;
      margin:0;
      padding:0 5px;
      border:1px solid #bfc8cc;
      border-radius:2px;
      background:#fff;
      color:#555;
      font-size:10px;
      font-weight:400;
      cursor:pointer;
    }
    .stage {
      width:100%;
      height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      background:#fff;
    }
    #vp {
      display:flex;
      align-items:center;
      justify-content:center;
      max-width:100%;
      max-height:100%;
    }
    #screen {
      max-width:100%;
      max-height:100%;
      display:none;
      cursor:crosshair;
      user-select:none;
      -webkit-user-drag:none;
    }
    .stage.focus #vp {
      display:block;
      overflow:hidden;
      max-width:100%;
      max-height:100%;
      background:#fff;
    }
    .stage.focus #screen {
      display:block;
      max-width:none;
      max-height:none;
      transform-origin:top left;
    }
    .placeholder {
      color:#7a7a7a;
      font-size:11px;
      text-align:center;
      padding:0 8px;
    }
    .actions {
      display:flex;
      justify-content:center;
      gap:14px;
      margin-top:18px;
    }
    button {
      height:26px;
      border:0;
      border-radius:0;
      color:#fff;
      font-size:12px;
      font-weight:700;
      line-height:26px;
      cursor:pointer;
    }
    button:disabled {
      opacity:.58;
      cursor:not-allowed;
    }
    #go {
      width:220px;
      background:var(--red);
    }
    #resetForm {
      width:130px;
      background:var(--cyan);
    }
    .btn-icon {
      display:inline-block;
      margin-right:6px;
      font-size:13px;
      line-height:1;
      vertical-align:-1px;
    }
    .status-panel {
      margin-top:14px;
      padding-top:10px;
      border-top:1px solid #e7eef2;
    }
    .msg {
      min-height:18px;
      color:#696969;
      font-size:12px;
      text-align:center;
    }
    .result {
      display:none;
      max-height:260px;
      margin-top:10px;
      padding:10px 12px;
      overflow:auto;
      border:1px solid #d8e4ea;
      background:#fbfdfe;
      color:#333;
      font-size:12px;
      white-space:pre-wrap;
      word-break:break-word;
    }
    .result .rtitle {
      margin-bottom:8px;
      color:#bd0000;
      font-size:13px;
      font-weight:700;
      white-space:normal;
    }
    .result .rlist {
      margin:0;
      padding:0;
      list-style:none;
    }
    .result .rlist li {
      padding:4px 0;
      border-bottom:1px solid #edf2f5;
      white-space:normal;
    }
    .result .rk {
      display:inline-block;
      min-width:110px;
      color:#666;
      font-weight:700;
    }
    .result .rsec {
      margin-top:9px;
      color:#555;
      white-space:normal;
    }
    @media (max-width:760px) {
      .page { margin:8px auto; }
      .lookup-title { min-width:230px; font-size:12px; }
      .lookup-body { padding:16px 10px 12px; }
      .form-grid {
        grid-template-columns:1fr;
        gap:12px;
      }
      .field,
      .captcha-row {
        grid-template-columns:112px 1fr;
      }
      label { text-align:left; }
      .captcha-box { max-width:none; }
      #go { width:170px; }
      #resetForm { width:110px; }
    }
    @media (max-width:460px) {
      .topbar h1 { display:none; }
      .field,
      .captcha-row {
        grid-template-columns:1fr;
        gap:4px;
      }
      .captcha-label { display:none; }
      .actions {
        flex-direction:column;
        gap:8px;
      }
      #go,
      #resetForm { width:100%; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="lookup">
      <div class="lookup-title">Tra cứu giá trị sử dụng thẻ BHYT</div>
      <div class="lookup-body">
        <div class="form-grid">
          <div class="field">
            <label for="maso">Mã số BHXH/thẻ<br>BHYT <span class="req">*</span></label>
            <input id="maso" value="0120225049" autocomplete="off" />
          </div>
          <div class="field">
            <label for="hoten">Họ tên <span class="req">*</span></label>
            <input id="hoten" value="Hứa Quang Linh" autocomplete="off" />
          </div>
          <div class="field">
            <label for="ngaysinh">Ngày/năm sinh <span class="req">*</span></label>
            <input id="ngaysinh" value="07/02/1999" autocomplete="off" />
          </div>
          <div class="captcha-row">
            <span class="captcha-label" aria-hidden="true">captcha</span>
            <div class="captcha-box" id="captchaBox">
              <div class="live-slot live">
                <div class="bar">
                  <span>Click "I'm not a robot"</span>
                  <button id="toggleView" class="mini" type="button">Toàn màn hình</button>
                </div>
                <div class="stage">
                  <span class="placeholder" id="ph">Đang tải live-view...</span>
                  <div id="vp"><img id="screen" alt="live-view" draggable="false" /></div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="actions">
          <button id="go" type="button"><span class="btn-icon">⌕</span>Tra cứu</button>
          <button id="resetForm" type="button"><span class="btn-icon">↻</span>Nhập lại</button>
        </div>

        <div class="status-panel">
          <div class="msg" id="msg">Nhập dữ liệu rồi bấm "Tra cứu".</div>
          <div class="result" id="result"></div>
        </div>
      </div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
