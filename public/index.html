<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Google reCAPTCHA Demo</title>
  <link rel="icon" href="data:," />
  <style>
    :root {
      --bg:#f7f8fa;
      --panel:#fff;
      --line:#d9dee5;
      --text:#1f2937;
      --muted:#6b7280;
      --blue:#1a73e8;
      --blue-dark:#1557b0;
      --red:#b42318;
      --green:#16833a;
    }

    * { box-sizing:border-box; }

    body {
      margin:0;
      min-height:100vh;
      font-family:Arial,Helvetica,sans-serif;
      background:var(--bg);
      color:var(--text);
    }

    .page {
      width:760px;
      max-width:calc(100vw - 24px);
      margin:24px auto;
    }

    .topbar {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      margin-bottom:12px;
    }

    h1 {
      margin:0;
      font-size:20px;
      line-height:1.2;
      font-weight:700;
    }

    .conn {
      display:flex;
      align-items:center;
      gap:7px;
      color:var(--muted);
      font-size:12px;
      white-space:nowrap;
    }

    .dot {
      width:8px;
      height:8px;
      border-radius:50%;
      background:#b8c0cc;
    }

    .dot.on { background:var(--green); }

    .panel {
      border:1px solid var(--line);
      border-radius:8px;
      background:var(--panel);
      overflow:hidden;
    }

    .panel-head {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      padding:14px 16px;
      border-bottom:1px solid var(--line);
    }

    .mode {
      min-width:0;
      color:var(--muted);
      font-size:12px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .actions {
      display:flex;
      gap:8px;
      flex:none;
    }

    button {
      height:32px;
      padding:0 14px;
      border:1px solid transparent;
      border-radius:6px;
      font-size:13px;
      font-weight:700;
      cursor:pointer;
    }

    button:disabled {
      opacity:.55;
      cursor:not-allowed;
    }

    #start {
      background:var(--blue);
      color:#fff;
    }

    #start:not(:disabled):hover { background:var(--blue-dark); }

    #reload {
      background:#fff;
      color:#374151;
      border-color:#cfd6df;
    }

    .stage {
      min-height:160px;
      padding:18px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#fbfcfe;
    }

    #viewport {
      position:relative;
      overflow:hidden;
      max-width:100%;
      background:#fff;
    }

    .stage.ready #viewport {
      border:1px solid #e4e7ec;
      box-shadow:0 1px 2px rgba(16,24,40,.06);
    }

    #screen {
      display:none;
      position:absolute;
      left:0;
      top:0;
      max-width:none;
      max-height:none;
      transform-origin:top left;
      cursor:crosshair;
      user-select:none;
      -webkit-user-drag:none;
    }

    .placeholder {
      color:var(--muted);
      font-size:13px;
      text-align:center;
    }

    .msg {
      min-height:38px;
      padding:12px 16px;
      border-top:1px solid var(--line);
      color:var(--muted);
      font-size:13px;
      line-height:1.35;
    }

    .msg.error { color:var(--red); }

    @media (max-width:560px) {
      .page { margin:12px auto; }
      .topbar,
      .panel-head {
        align-items:flex-start;
        flex-direction:column;
      }
      .actions,
      button { width:100%; }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="topbar">
      <h1>Google reCAPTCHA Demo</h1>
      <div class="conn">
        <span id="dot" class="dot"></span>
        <span id="connText">connecting</span>
      </div>
    </div>

    <section class="panel">
      <div class="panel-head">
        <div id="modeTag" class="mode">loading target</div>
        <div class="actions">
          <button id="start" type="button" disabled>Open demo</button>
          <button id="reload" type="button" disabled>Reload</button>
        </div>
      </div>

      <div id="stage" class="stage">
        <span id="placeholder" class="placeholder">Loading live view...</span>
        <div id="viewport">
          <img id="screen" alt="live captcha" draggable="false" />
        </div>
      </div>

      <div id="msg" class="msg">Click "Open demo" to load Google's demo captcha page.</div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
